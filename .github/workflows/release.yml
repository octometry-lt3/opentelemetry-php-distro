---
name: release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: deb-release-publication
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      BUILT_PACKAGES_DIR: _BUILT/packages
      GITHUB_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Preflight release version and uniqueness
        shell: bash
        run: |
          set -euo pipefail

          source ./tools/read_properties.sh
          read_properties project.properties PROJECT_PROPERTIES

          [[ -n "${MERGE_SHA}" ]] || { echo 'merge_commit_sha is required'; exit 1; }
          [[ "${PROJECT_PROPERTIES_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid project.properties version: ${PROJECT_PROPERTIES_VERSION}"
            exit 1
          }

          installer_default_version="$(awk -F\' '/^readonly DEFAULT_VERSION=/{print $2}' tools/install/install.sh)"
          [[ "${installer_default_version}" == "${PROJECT_PROPERTIES_VERSION}" ]] || {
            echo "Installer default (${installer_default_version:-missing}) does not match project.properties (${PROJECT_PROPERTIES_VERSION})"
            exit 1
          }

          tag_name="v${PROJECT_PROPERTIES_VERSION}"
          for endpoint in "git/ref/tags/${tag_name}" "releases/tags/${tag_name}"; do
            response="$(mktemp)"
            set +e
            gh api --include "repos/${GITHUB_REPOSITORY}/${endpoint}" >"${response}" 2>&1
            gh_status=$?
            set -e
            http_status="$(awk '/^HTTP\// {print $2; exit}' "${response}")"
            rm -f "${response}"

            if [[ "${gh_status}" -eq 0 ]]; then
              echo "Release preflight failed: ${endpoint} already exists."
              exit 1
            fi
            if [[ "${http_status}" != '404' ]]; then
              echo "Release preflight failed: unable to confirm ${endpoint} is absent (HTTP ${http_status:-unknown})."
              exit 1
            fi
          done

          {
            echo "package_version=${PROJECT_PROPERTIES_VERSION}"
            echo "tag_name=${tag_name}"
            echo "deb_asset=opentelemetry-php-distro_${PROJECT_PROPERTIES_VERSION}_amd64.deb"
          } >> "${GITHUB_OUTPUT}"
        id: preflight

      - name: Build native code and run native unit tests
        run: ./tools/build/build_native.sh --build_architecture linux-x86-64

      - name: Build PHP package payload
        run: |
          source ./tools/read_properties.sh
          read_properties project.properties PROJECT_PROPERTIES
          ./tools/build/build_php_code_for_packages.sh --php_versions "${PROJECT_PROPERTIES_SUPPORTED_PHP_VERSIONS//[()]/}"

      - name: Build and smoke-test amd64 DEB
        run: |
          ./tools/build/build_packages.sh \
            --package_version "${{ steps.preflight.outputs.package_version }}" \
            --build_architecture linux-x86-64 \
            --package_goarchitecture amd64 \
            --package_types 'deb' \
            --package_sha "${MERGE_SHA}"

      - name: Verify release assets and built checksum
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_deb="${{ steps.preflight.outputs.deb_asset }}"
          expected_checksum="${expected_deb}.sha512"
          deb_assets=("${BUILT_PACKAGES_DIR}"/*.deb)
          checksum_assets=("${BUILT_PACKAGES_DIR}"/*.deb.sha512)

          [[ "${#deb_assets[@]}" -eq 1 && "${#checksum_assets[@]}" -eq 1 ]] || {
            echo 'Expected exactly one amd64 DEB and one matching checksum.'
            exit 1
          }
          [[ "$(basename "${deb_assets[0]}")" == "${expected_deb}" ]] || {
            echo "Unexpected DEB asset: ${deb_assets[0]}"
            exit 1
          }
          [[ "$(basename "${checksum_assets[0]}")" == "${expected_checksum}" ]] || {
            echo "Unexpected checksum asset: ${checksum_assets[0]}"
            exit 1
          }

          (cd "${BUILT_PACKAGES_DIR}" && sha512sum --check "${expected_checksum}")
          echo "deb_path=${BUILT_PACKAGES_DIR}/${expected_deb}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${BUILT_PACKAGES_DIR}/${expected_checksum}" >> "${GITHUB_OUTPUT}"

      - name: Test installer against built DEB
        run: |
          ./tools/install/test_install.sh \
            --deb "${{ steps.assets.outputs.deb_path }}" \
            --version "${{ steps.preflight.outputs.package_version }}"

      - name: Create draft release
        run: |
          gh release create "${{ steps.preflight.outputs.tag_name }}" \
            --draft \
            --target "${MERGE_SHA}" \
            --title "${{ steps.preflight.outputs.tag_name }}" \
            --generate-notes \
            "${{ steps.assets.outputs.deb_path }}" \
            "${{ steps.assets.outputs.checksum_path }}" \
            'tools/install/install.sh#install.sh'

      - name: Verify downloaded draft assets
        shell: bash
        run: |
          set -euo pipefail

          download_dir="$(mktemp -d)"
          trap 'rm -rf "${download_dir}"' EXIT
          gh release download "${{ steps.preflight.outputs.tag_name }}" \
            --dir "${download_dir}" \
            --pattern "${{ steps.preflight.outputs.deb_asset }}" \
            --pattern "${{ steps.preflight.outputs.deb_asset }}.sha512" \
            --pattern install.sh

          expected_files=(
            install.sh
            "${{ steps.preflight.outputs.deb_asset }}"
            "${{ steps.preflight.outputs.deb_asset }}.sha512"
          )
          mapfile -t downloaded_files < <(find "${download_dir}" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${#downloaded_files[@]}" -eq "${#expected_files[@]}" ]] || {
            echo 'Draft release has an unexpected asset count.'
            exit 1
          }
          for index in "${!expected_files[@]}"; do
            [[ "${downloaded_files[${index}]}" == "${expected_files[${index}]}" ]] || {
              echo "Unexpected draft asset: ${downloaded_files[${index}]:-missing}"
              exit 1
            }
          done

          (cd "${download_dir}" && sha512sum --check "${{ steps.preflight.outputs.deb_asset }}.sha512")
          cmp tools/install/install.sh "${download_dir}/install.sh"
          cmp "${{ steps.assets.outputs.checksum_path }}" "${download_dir}/${{ steps.preflight.outputs.deb_asset }}.sha512"

      - name: Publish release
        run: gh release edit "${{ steps.preflight.outputs.tag_name }}" --draft=false
